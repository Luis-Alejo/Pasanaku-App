<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pasanaku</title>

    <base href="/" />

    <!-- Color de la barra del navegador/sistema. ThemeService lo actualiza según el tema elegido. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Aplica el tema guardado antes de pintar, para que no destelle el tema equivocado.
         Misma clave y regla que ThemeService (core/services/theme.service.ts). -->
    <script>
      try {
        var pkTheme =
          localStorage.getItem('pk-theme') ||
          (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (pkTheme === 'dark') {
          document.documentElement.classList.add('ion-palette-dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f0e1f');
        }
      } catch (e) {}
    </script>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
