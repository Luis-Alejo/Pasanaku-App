<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Grupos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Grupos</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="page">
    <ion-segment [value]="segment()" (ionChange)="onSegmentChange($event)" aria-label="Qué grupos ver">
      <ion-segment-button value="mine">Mis grupos</ion-segment-button>
      <ion-segment-button value="public">Públicos</ion-segment-button>
    </ion-segment>

    @if (showSpinner()) {
    <div class="loading" role="status">
      <ion-spinner aria-hidden="true" />
      <span class="visually-hidden">Cargando grupos</span>
    </div>
    } @else if (store.listError()) {
    <app-empty-state
      [icon]="icons.error"
      title="No pudimos cargar los grupos"
      message="Revisa tu conexión e inténtalo de nuevo."
    >
      <ion-button fill="outline" (click)="retry()">Reintentar</ion-button>
    </app-empty-state>
    } @else { @for (group of groups(); track group.id) {
    <app-group-card [group]="group" [userId]="store.currentUserId()" />
    } @empty { @if (segment() === 'mine') {
    <app-empty-state
      [icon]="icons.mine"
      title="Aún no tienes grupos"
      message="Cuando te unas a un pasanaku o crees uno, aparecerá aquí."
    />
    } @else {
    <app-empty-state
      [icon]="icons.public"
      title="No hay grupos públicos con cupo"
      message="Vuelve más tarde o crea tu propio grupo."
    />
    } } }
  </div>
</ion-content>
