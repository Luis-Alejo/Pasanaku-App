<ion-content [fullscreen]="true">
  @if (user(); as u) {
  <!-- Setting del kit: encabezado índigo con avatar grande centrado y nombre en índigo -->
  <app-brand-header>
    <h1 class="screen-title">Perfil</h1>
    <div pkOverlap class="person">
      <app-avatar class="person-avatar" [name]="u.displayName" size="lg" />
      <p class="name">{{ u.displayName }}</p>
      <p class="email">{{ u.email ?? u.phone }}</p>
    </div>
  </app-brand-header>

  <div class="page">
    @if (u.kycStatus !== 'VERIFIED') {
    <section class="section" aria-labelledby="identity-title">
      <h2 id="identity-title" class="pk-section-title">Identidad</h2>
      <div class="pk-card wallet">
        <p class="label">Verifícala para crear un grupo o unirte a uno.</p>
        <ion-button class="identity" expand="block" fill="outline" routerLink="/auth/verify">
          Verificar identidad
        </ion-button>
      </div>
    </section>
    }

    <section class="section" aria-labelledby="account-title">
      <h2 id="account-title" class="pk-section-title">Cuenta</h2>
      <div class="pk-card">
        <app-info-row label="Celular" [value]="u.phone" />
        @if (u.email) {
        <app-info-row label="Correo" [value]="u.email" />
        }
        <app-info-row label="Identidad" [value]="u.kycStatus === 'VERIFIED' ? 'Verificada' : 'Sin verificar'" />
      </div>
    </section>

    <section class="section" aria-labelledby="appearance-title">
      <h2 id="appearance-title" class="pk-section-title">Apariencia</h2>
      <div class="pk-card">
        <ion-toggle
          class="theme-toggle"
          justify="space-between"
          [checked]="theme.isDark()"
          (ionChange)="theme.setMode($event.detail.checked ? 'dark' : 'light')"
        >
          Modo oscuro
        </ion-toggle>
      </div>
    </section>

    <ion-button class="logout" expand="block" fill="clear" color="danger" (click)="logout()">
      Cerrar sesión
    </ion-button>
  </div>
  }
</ion-content>
