fragment GroupSummaryFields on GroupSummary {
  id
  name
  creatorId
  contributionStroops
  frequency
  maxParticipants
  memberCount
  isPublic
  status
  currentRound
  roundDurationSeconds
  createdAt
}

fragment GroupDetailFields on GroupDetail {
  id
  name
  creatorId
  contributionStroops
  frequency
  maxParticipants
  memberCount
  isPublic
  status
  currentRound
  roundDurationSeconds
  createdAt
  members {
    id
    userId
    fullName
    initialTurnOrder
    currentQueuePosition
    hasReceivedPayout
    joinedAt
  }
  rounds {
    id
    roundNumber
    deadline
    isSettled
    beneficiaryMemberId
    settleTxHash
    settledAt
    payments {
      id
      memberId
      status
      paidAt
      txHash
    }
  }
  debts {
    id
    debtorMemberId
    beneficiaryMemberId
    originalRoundId
    originalAmountStroops
    remainingAmountStroops
    status
    lastPaymentTxHash
  }
}

fragment GroupPreviewFields on GroupPreview {
  id
  name
  creatorId
  contributionStroops
  frequency
  maxParticipants
  memberCount
  isPublic
  status
  currentRound
  roundDurationSeconds
  createdAt
  isInvited
  isMember
}

query GroupPreview($groupId: ID!) {
  groupPreview(groupId: $groupId) {
    ...GroupPreviewFields
  }
}

query MyInvitations {
  myInvitations {
    ...GroupSummaryFields
  }
}

mutation UpdateGroup($input: UpdateGroupInput!) {
  updateGroup(input: $input) {
    id
    name
  }
}

mutation CancelGroup($groupId: ID!) {
  cancelGroup(groupId: $groupId) {
    id
    status
  }
}

query MyGroups {
  myGroups {
    ...GroupSummaryFields
  }
}

query PublicGroups {
  publicGroups(limit: 50) {
    ...GroupSummaryFields
  }
}

query GroupDetail($groupId: ID!) {
  groupDetail(groupId: $groupId) {
    ...GroupDetailFields
  }
}

mutation CreateGroup($input: CreateGroupInput!) {
  createGroup(input: $input) {
    ...GroupSummaryFields
  }
}

mutation JoinGroup($groupId: ID!) {
  joinGroup(groupId: $groupId) {
    txHash
  }
}

mutation InviteMember($input: InviteMemberInput!) {
  inviteMember(input: $input) {
    txHash
  }
}

mutation SetTurnOrder($input: SetTurnOrderInput!) {
  setTurnOrder(input: $input) {
    txHash
  }
}

mutation StartGroup($groupId: ID!) {
  startGroup(groupId: $groupId) {
    txHash
  }
}

mutation PayRound($groupId: ID!) {
  payRound(groupId: $groupId) {
    txHash
  }
}
