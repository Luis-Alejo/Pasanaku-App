<ion-tabs>
  <!-- Barra inferior del kit: la pestaña activa es una pastilla índigo con ícono y texto;
       las demás muestran solo el ícono (el texto sigue disponible para lectores de pantalla). -->
  <ion-tab-bar slot="bottom" id="app-tab-bar">
    <ion-tab-button tab="home" href="/tabs/home" layout="icon-start">
      <ion-icon aria-hidden="true" [icon]="icons.home"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="groups" href="/tabs/groups" layout="icon-start">
      <ion-icon aria-hidden="true" [icon]="icons.groups"></ion-icon>
      <ion-label>Grupos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="wallet" href="/tabs/wallet" layout="icon-start">
      <ion-icon aria-hidden="true" [icon]="icons.wallet"></ion-icon>
      <ion-label>Billetera</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/tabs/profile" layout="icon-start">
      <ion-icon aria-hidden="true" [icon]="icons.profile"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
