<fieldset class="group">
  <legend class="legend">{{ legend() }}</legend>
  <div class="options">
    @for (o of options(); track o.value) {
      <label class="option">
        <input
          type="radio"
          class="visually-hidden"
          [name]="name"
          [value]="o.value"
          [checked]="value() === o.value"
          (change)="value.set(o.value)"
        />
        <span class="chip">{{ o.label }}</span>
      </label>
    }
  </div>
</fieldset>
